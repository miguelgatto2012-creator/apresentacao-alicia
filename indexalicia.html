<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recap ejota social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* paleta da apresentação: magenta, vinho, rosa claro, branco. Layout: palco vertical 9:16, texto à esquerda, formas em paralelogramo ao fundo */
:root{
  --magenta:#E6007E;
  --wine:#8B0A50;
  --pale:#FFE4F0;
  --white:#FFFFFF;
  --hot:#FF4DA6;
  --font:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#4A0A2C;font-family:var(--font);color:var(--wine);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{height:100%;display:grid;place-items:center}
#stage{
  position:relative;container-type:size;overflow:hidden;
  width:min(100vw,calc(100dvh*9/16));height:min(100dvh,calc(100vw*16/9));
  background:var(--bg);color:var(--fg);
  transition:background-color .5s ease;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  cursor:pointer;
}
@media (min-width:600px){#stage{border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.45)}}

.th-magenta{--bg:var(--magenta);--fg:#fff;--accent:var(--pale);--card:#fff;--cardfg:var(--wine);--num:#fff;--deco:rgba(255,255,255,.14);--tbl:var(--wine);--tag:var(--magenta)}
.th-wine{--bg:var(--wine);--fg:var(--pale);--accent:var(--hot);--card:var(--pale);--cardfg:var(--wine);--num:var(--hot);--deco:rgba(255,255,255,.07);--tbl:var(--magenta);--tag:var(--magenta)}
.th-pale{--bg:var(--pale);--fg:var(--wine);--accent:var(--magenta);--card:#fff;--cardfg:var(--wine);--num:var(--magenta);--deco:rgba(230,0,126,.10);--tbl:var(--wine);--tag:var(--magenta)}
.th-white{--bg:#fff;--fg:var(--wine);--accent:var(--magenta);--card:var(--pale);--cardfg:var(--wine);--num:var(--magenta);--deco:rgba(230,0,126,.08);--tbl:var(--magenta);--tag:var(--magenta)}

/* cabeçalho */
#bars{position:absolute;z-index:5;top:3.6cqw;left:4cqw;right:4cqw;display:flex;gap:1.4cqw}
#bars i{flex:1;height:1.1cqw;border-radius:2cqw;background:color-mix(in srgb,var(--fg) 28%,transparent);transition:background-color .3s}
#bars i.on{background:var(--fg)}
#head{position:absolute;z-index:5;top:7.2cqw;left:5cqw;right:4cqw;display:flex;justify-content:space-between;align-items:center}
#brand{font-weight:800;font-size:4.2cqw;letter-spacing:-.01em}
#snd{all:unset;cursor:pointer;width:9cqw;height:9cqw;border-radius:50%;display:grid;place-items:center;color:var(--fg)}
#snd:focus-visible,.btn:focus-visible{outline:.7cqw solid var(--accent);outline-offset:.6cqw}
#snd svg{width:5.4cqw;height:5.4cqw}
#snd .off{display:none}
#snd[aria-pressed="true"] .on{display:none}
#snd[aria-pressed="true"] .off{display:block}

#scene{position:absolute;inset:0;z-index:2}
.deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;color:var(--deco)}
.deco svg{position:absolute;fill:currentColor}
.d1{width:78cqw;right:-26cqw;top:22cqw;transform:rotate(-14deg);animation:float 7s ease-in-out infinite}
.d2{width:70cqw;left:-30cqw;bottom:-8cqw;transform:rotate(12deg);animation:float 8s ease-in-out infinite reverse}
.d3{width:30cqw;right:6cqw;bottom:20cqw;transform:rotate(-6deg);animation:float 6s ease-in-out infinite}
@keyframes float{50%{translate:0 -2.4cqw}}

.pane{position:absolute;inset:0;padding:22cqw 8cqw 12cqw;display:flex;flex-direction:column}

/* fase da batida */
.drum{justify-content:flex-start;transition:opacity .25s,transform .25s}
.q{font-size:7.4cqw;font-weight:800;line-height:1.08;letter-spacing:-.02em;margin-top:8cqw;max-width:78cqw;text-wrap:balance;animation:rise .6s both}
.drumsvg{width:92cqw;margin:16cqw 0 0 -4cqw;overflow:visible}
.cap{margin-top:5cqw;font-size:5.6cqw;font-weight:700;min-height:8cqw;animation:rise .6s .3s both}
#scene[data-phase="rev"] .drum{opacity:0;transform:translateY(5cqw);pointer-events:none}
#scene[data-phase="drum"] .rev{visibility:hidden}

/* fase da revelação */
.rev{justify-content:center;padding-top:16cqw}
.big{font-size:var(--fs,40cqw);font-weight:800;line-height:.9;letter-spacing:-.05em;color:var(--num);font-variant-numeric:tabular-nums;transform-origin:left center}
#scene[data-phase="rev"] .big.pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
.label{margin-top:4cqw;font-size:8cqw;font-weight:800;line-height:1.05;letter-spacing:-.02em;max-width:76cqw}
.chips{display:flex;flex-wrap:wrap;gap:2.4cqw;margin-top:7cqw}
.chip{background:var(--card);color:var(--cardfg);font-weight:700;font-size:4.4cqw;padding:2.6cqw 4.4cqw;border-radius:4.6cqw}
.note{margin-top:6cqw;font-size:5cqw;font-weight:500;line-height:1.3;max-width:74cqw}
.note b{font-weight:800}
#scene[data-phase="rev"] .label,#scene[data-phase="rev"] .chip,#scene[data-phase="rev"] .note{animation:rise .6s both}
#scene[data-phase="rev"] .label{animation-delay:.25s}
#scene[data-phase="rev"] .chip:nth-child(1){animation-delay:.5s}
#scene[data-phase="rev"] .chip:nth-child(2){animation-delay:.65s}
#scene[data-phase="rev"] .note{animation-delay:.7s}

/* aprendizados */
.learn .big{--fs:30cqw}
.cards{display:flex;flex-direction:column;gap:2.6cqw;margin-top:7cqw}
.lc{background:var(--card);color:var(--cardfg);border-radius:5cqw;padding:3.4cqw 4.6cqw}
.lc small{display:block;font-size:3.4cqw;font-weight:800;color:var(--tag);margin-bottom:.8cqw}
.lc span{font-size:4.5cqw;font-weight:700;line-height:1.22}
#scene[data-phase="rev"] .lc{animation:rise .6s both}
#scene[data-phase="rev"] .lc:nth-child(1){animation-delay:.9s}
#scene[data-phase="rev"] .lc:nth-child(2){animation-delay:1.5s}
#scene[data-phase="rev"] .lc:nth-child(3){animation-delay:2.1s}

/* intro */
.intro{justify-content:center;padding-top:18cqw}
.pin{width:20cqw;height:20cqw;color:var(--fg);animation:spin 9s linear infinite}
.kick{margin-top:9cqw;font-size:5.4cqw;font-weight:700;animation:rise .6s .1s both}
.h1{margin-top:3cqw;font-size:13.4cqw;font-weight:800;line-height:.98;letter-spacing:-.04em;text-wrap:balance;animation:rise .7s .25s both}
.sub{margin-top:5cqw;font-size:5cqw;font-weight:500;animation:rise .7s .4s both}
.btn{all:unset;cursor:pointer;display:inline-block;margin-top:10cqw;background:var(--card);color:var(--cardfg);font-weight:800;font-size:5.4cqw;padding:3.8cqw 9cqw;border-radius:99px;animation:rise .7s .55s both,pulse 2.2s 1.4s ease-in-out infinite;align-self:flex-start}

/* final */
.fin{justify-content:center;padding-top:20cqw}
.fin .h1{font-size:12cqw;margin-top:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:2.6cqw;margin-top:7cqw}
.tile{background:var(--card);color:var(--cardfg);border-radius:5cqw;padding:3.6cqw 4.4cqw;animation:rise .6s both}
.tile:nth-child(1){animation-delay:.5s}.tile:nth-child(2){animation-delay:.62s}.tile:nth-child(3){animation-delay:.74s}.tile:nth-child(4){animation-delay:.86s}.tile:nth-child(5){animation-delay:.98s;grid-column:span 2}
.tile b{display:block;font-size:9.6cqw;line-height:1;letter-spacing:-.04em;color:var(--accent);font-variant-numeric:tabular-nums}
.tile span{display:block;margin-top:1.2cqw;font-size:3.7cqw;font-weight:700}
.fin .sub{max-width:76cqw}
.fin .btn{margin-top:6cqw;font-size:4.6cqw;padding:3.2cqw 7cqw;animation:rise .7s 1.1s both}

#hint{position:absolute;z-index:5;left:0;right:0;bottom:5cqw;text-align:center;font-size:3.6cqw;font-weight:700;opacity:.75;pointer-events:none}
#flash{position:absolute;inset:0;z-index:4;background:#fff;opacity:0;pointer-events:none}
#fx{position:absolute;inset:0;z-index:3;overflow:hidden;pointer-events:none}
.piece{position:absolute;width:5cqw;height:7cqw;clip-path:polygon(28% 0,100% 0,72% 100%,0 100%);left:0;top:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

@keyframes rise{from{opacity:0;transform:translateY(4cqw)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="leaf" viewBox="0 0 120 100"><path d="M36 3H108Q123 3 117 17L90 83Q85 97 70 97H12Q-3 97 3 83L28 17Q31 3 36 3Z"/></symbol>
    <symbol id="pinw" viewBox="-30 -30 60 60">
      <g fill="currentColor">
        <path d="M1 -2V-24Q1 -29 6 -26L25 -15Q29 -12 25 -9L9 -2Z"/>
        <path transform="rotate(90)" d="M1 -2V-24Q1 -29 6 -26L25 -15Q29 -12 25 -9L9 -2Z"/>
        <path transform="rotate(180)" d="M1 -2V-24Q1 -29 6 -26L25 -15Q29 -12 25 -9L9 -2Z"/>
        <path transform="rotate(270)" d="M1 -2V-24Q1 -29 6 -26L25 -15Q29 -12 25 -9L9 -2Z"/>
      </g>
    </symbol>
  </defs>
</svg>

<div id="app">
  <main id="stage" class="th-magenta" aria-label="Recap trimestral">
    <div id="bars" aria-hidden="true"></div>
    <div id="head">
      <span id="brand">ejota · social</span>
      <button id="snd" type="button" aria-label="Som" aria-pressed="false">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
    </div>
    <div id="scene" data-phase="rev"></div>
    <div id="fx"></div>
    <div id="flash"></div>
    <div id="hint"></div>
    <div id="live" class="sr" aria-live="polite"></div>
  </main>
</div>

<script>
(function(){
  var NOME = 'Alícia';
  var $ = function(s){return document.querySelector(s)};
  var stage=$('#stage'), scene=$('#scene'), barsEl=$('#bars'), hint=$('#hint'), live=$('#live'), fx=$('#fx'), flashEl=$('#flash'), snd=$('#snd');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  var S = [
    {t:'intro', th:'magenta'},
    {t:'num', th:'wine', q:'quantos roteiros você escreveu?', n:24, label:'roteiros escritos', note:'uma média de <b>8 por mês</b>, cada um com feedback no doc.'},
    {t:'num', th:'pale', q:'e quantos reels e mídias saíram das suas mãos?', n:17, label:'reels e mídias produzidos', chips:['11 reels','6 mídias']},
    {t:'num', th:'magenta', q:'quantos likes tiveram os posts que você ajudou a criar?', n:3842, label:'likes nos seus posts', chips:['48,3 mil visualizações','312 comentários']},
    {t:'num', th:'white', q:'e quantas vezes mandaram pra frente?', n:276, label:'compartilhamentos', note:'seu post mais compartilhado: o <b>reels da black friday</b>, com 94 envios.'},
    {t:'learn', th:'wine', q:'e o que você aprendeu em cada upload?', n:12, label:'aprendizados registrados', cards:[
      ['reel · recrutamento','luz natural muda tudo na gravação.'],
      ['roteiro · evento','roteiro curto segura mais do que roteiro bonito.'],
      ['mídia · black friday','pedir feedback antes da edição evita refazer tudo.']
    ]},
    {t:'final', th:'magenta'}
  ];

  var cur=0, phase='rev', timers=[], anims=[], muted=false, ac=null, raf=0;

  function later(fn,ms){ var id=setTimeout(fn,ms); timers.push(id); return id; }
  function clearAll(){ timers.forEach(clearTimeout); timers=[]; anims.forEach(function(a){try{a.cancel()}catch(e){}}); anims=[]; cancelAnimationFrame(raf); fx.innerHTML=''; }
  function anim(el,kf,opt){ if(!el||!el.animate) return null; var a=el.animate(kf,opt); anims.push(a); return a; }
  function fmt(n){ return n.toLocaleString('pt-BR'); }

  /* ---------- som ---------- */
  function ensureAudio(){
    if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ac=null; } }
    if(ac && ac.state==='suspended'){ try{ ac.resume(); }catch(e){} }
  }
  function thump(big){
    if(!ac||muted) return;
    try{
      var t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.setValueAtTime(big?120:155,t); o.frequency.exponentialRampToValueAtTime(42,t+.15);
      g.gain.setValueAtTime(big?.95:.6,t); g.gain.exponentialRampToValueAtTime(.001,t+(big?.5:.2));
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+.55);
      var len=Math.floor(ac.sampleRate*.05), b=ac.createBuffer(1,len,ac.sampleRate), d=b.getChannelData(0);
      for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
      var n=ac.createBufferSource(), f=ac.createBiquadFilter(), ng=ac.createGain();
      n.buffer=b; f.type='lowpass'; f.frequency.value=1600; ng.gain.value=big?.55:.28;
      n.connect(f); f.connect(ng); ng.connect(ac.destination); n.start(t);
    }catch(e){}
  }
  function chime(){
    if(!ac||muted) return;
    try{
      [523.25,659.25,783.99,1046.5].forEach(function(fr,i){
        var t=ac.currentTime+.05+i*.075, o=ac.createOscillator(), g=ac.createGain();
        o.type='triangle'; o.frequency.value=fr;
        g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.16,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+.6);
        o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+.65);
      });
    }catch(e){}
  }
  snd.addEventListener('click',function(e){
    e.stopPropagation(); ensureAudio();
    muted=!muted; snd.setAttribute('aria-pressed',String(muted));
  });

  /* ---------- peças de cena ---------- */
  function deco(){
    return '<div class="deco" aria-hidden="true">'+
      '<svg class="d1" viewBox="0 0 120 100"><use href="#leaf"/></svg>'+
      '<svg class="d2" viewBox="0 0 120 100"><use href="#leaf"/></svg>'+
      '<svg class="d3" viewBox="0 0 120 100"><use href="#leaf"/></svg></div>';
  }
  function drumSvg(){
    function fist(cls,x){
      return '<g class="'+cls+'" style="transform:translateY(-52px)"><g transform="translate('+x+' 190)">'+
        '<rect x="-13" y="-200" width="26" height="150" rx="6" fill="var(--card)" stroke="var(--fg)" stroke-width="3"/>'+
        '<rect x="-31" y="-54" width="62" height="54" rx="22" fill="var(--card)" stroke="var(--fg)" stroke-width="3"/>'+
        '<path d="M-15 -30Q0 -20 15 -30" fill="none" stroke="var(--fg)" stroke-width="3" stroke-linecap="round"/>'+
        '<rect x="-19" y="-82" width="38" height="16" rx="5" fill="var(--accent)" stroke="var(--fg)" stroke-width="3"/>'+
        '</g></g>';
    }
    return '<svg class="drumsvg" viewBox="0 0 360 270" aria-hidden="true">'+
      '<defs><linearGradient id="fade" x1="0" y1="-30" x2="0" y2="95" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient><mask id="am" maskUnits="userSpaceOnUse" x="-20" y="-300" width="400" height="600"><rect x="-20" y="-300" width="400" height="600" fill="url(#fade)"/></mask></defs>'+
      '<g class="shk">'+
      '<rect x="62" y="205" width="13" height="60" rx="4" fill="var(--tbl)"/><rect x="285" y="205" width="13" height="60" rx="4" fill="var(--tbl)"/>'+
      '<rect x="22" y="188" width="316" height="20" rx="10" fill="var(--tbl)"/>'+
      '<ellipse class="rpL" cx="115" cy="190" rx="26" ry="6" fill="none" stroke="var(--accent)" stroke-width="3" style="opacity:0;transform-box:fill-box;transform-origin:center"/>'+
      '<ellipse class="rpR" cx="245" cy="190" rx="26" ry="6" fill="none" stroke="var(--accent)" stroke-width="3" style="opacity:0;transform-box:fill-box;transform-origin:center"/>'+
      '<g transform="translate(180 188)"><g class="cup">'+
        '<path d="M14 -24H22Q30 -24 30 -15Q30 -6 20 -6H14" fill="none" stroke="var(--fg)" stroke-width="3.5" stroke-linecap="round"/>'+
        '<rect x="-16" y="-34" width="32" height="34" rx="7" fill="var(--card)" stroke="var(--fg)" stroke-width="3"/>'+
        '<rect x="-16" y="-24" width="32" height="7" fill="var(--accent)"/>'+
      '</g></g>'+
      '<g mask="url(#am)">'+fist('fL',115)+fist('fR',245)+'</g>'+
      '</g></svg>';
  }
  function bigFs(n){ var l=fmt(n).length; return l<=2?'44cqw':(l===3?'36cqw':'26cqw'); }

  function html(s){
    if(s.t==='intro'){
      return deco()+'<div class="pane intro">'+
        '<svg class="pin" viewBox="0 0 60 60" aria-hidden="true"><use href="#pinw"/></svg>'+
        '<p class="kick">oi, '+NOME+'</p>'+
        '<h1 class="h1">seu recap de 3 meses chegou.</h1>'+
        '<p class="sub">set · out · nov 2026</p>'+
        '<button class="btn" type="button" id="go">começar</button></div>';
    }
    if(s.t==='final'){
      var tl=[['24','roteiros'],['17','reels e mídias'],['3.842','likes'],['276','compartilhamentos'],['12','aprendizados registrados']];
      return deco()+'<div class="pane fin">'+
        '<h1 class="h1">parabéns, '+NOME.toLowerCase()+'!</h1>'+
        '<div class="tiles">'+tl.map(function(x){return '<div class="tile"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'}).join('')+'</div>'+
        '<p class="sub" style="margin-top:6cqw;animation-delay:1s">você produziu, aprendeu e deixou o desenvolvimento visível. até o próximo recap.</p>'+
        '<button class="btn" type="button" id="again">ver de novo</button></div>';
    }
    var chips = s.chips ? '<div class="chips">'+s.chips.map(function(c){return '<span class="chip">'+c+'</span>'}).join('')+'</div>' : '';
    var note = s.note ? '<p class="note">'+s.note+'</p>' : '';
    var cards = s.cards ? '<div class="cards">'+s.cards.map(function(c){return '<div class="lc"><small>'+c[0]+'</small><span>'+c[1]+'</span></div>'}).join('')+'</div>' : '';
    return deco()+
      '<div class="pane drum"><p class="q">'+s.q+'</p>'+drumSvg()+'<p class="cap" id="cap">segura aí…</p></div>'+
      '<div class="pane rev'+(s.t==='learn'?' learn':'')+'"><div class="big" id="big" style="--fs:'+bigFs(s.n)+'">0</div>'+
        '<p class="label">'+s.label+'</p>'+chips+note+cards+'</div>';
  }

  /* ---------- barras ---------- */
  function renderBars(){
    var h=''; for(var i=0;i<S.length;i++) h+='<i class="'+(i<=cur?'on':'')+'"></i>';
    barsEl.innerHTML=h;
  }
  function setHint(t){ hint.textContent=t; }

  /* ---------- efeitos ---------- */
  function flash(){ anim(flashEl,[{opacity:0},{opacity:.65,offset:.2},{opacity:0}],{duration:420,easing:'ease-out'}); }
  function confetti(srcEl){
    if(reduce) return;
    var sr=stage.getBoundingClientRect(), r=srcEl?srcEl.getBoundingClientRect():sr;
    var ox=(r.left-sr.left)+Math.min(r.width,sr.width*.5)/2, oy=(r.top-sr.top)+r.height/2;
    var th=stage.className.replace('th-','');
    var all=['#E6007E','#8B0A50','#FFE4F0','#FFFFFF','#FF4DA6'];
    var bgc={magenta:'#E6007E',wine:'#8B0A50',pale:'#FFE4F0',white:'#FFFFFF'}[th];
    var cols=all.filter(function(c){return c!==bgc});
    for(var i=0;i<26;i++){
      var p=document.createElement('div'); p.className='piece';
      p.style.background=cols[i%cols.length]; p.style.left=ox+'px'; p.style.top=oy+'px';
      fx.appendChild(p);
      var ang=Math.random()*Math.PI*2, dist=sr.width*(.25+Math.random()*.5);
      var dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-sr.width*.15, rot=(Math.random()-.5)*720;
      anim(p,[
        {transform:'translate(0,0) rotate(0deg) scale(.4)',opacity:1},
        {transform:'translate('+dx+'px,'+dy+'px) rotate('+rot/2+'deg) scale(1)',opacity:1,offset:.45},
        {transform:'translate('+dx*1.15+'px,'+(dy+sr.width*.7)+'px) rotate('+rot+'deg) scale(.9)',opacity:0}
      ],{duration:1500+Math.random()*500,easing:'cubic-bezier(.2,.7,.4,1)',fill:'forwards'});
    }
  }
  function countUp(el,n){
    if(!el) return;
    if(reduce){ el.textContent=fmt(n); return; }
    var t0=performance.now(), dur=1100;
    function step(t){
      var k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
      el.textContent=fmt(Math.round(n*e));
      if(k<1) raf=requestAnimationFrame(step);
    }
    raf=requestAnimationFrame(step);
  }

  /* ---------- batida na mesa ---------- */
  function impact(x){
    thump(false);
    var rp=scene.querySelector(x==='L'?'.rpL':'.rpR'), cup=scene.querySelector('.cup'), shk=scene.querySelector('.shk');
    anim(rp,[{opacity:.9,transform:'scale(.4)'},{opacity:0,transform:'scale(2.1)'}],{duration:420,easing:'ease-out'});
    anim(cup,[{transform:'translateY(0)'},{transform:'translateY(-14px)',offset:.4},{transform:'translateY(0)'}],{duration:260,easing:'ease-out'});
    anim(shk,[{transform:'translateY(0)'},{transform:'translateY(2.5px)',offset:.3},{transform:'translateY(0)'}],{duration:150});
  }
  function hit(side){
    var f=scene.querySelector(side==='L'?'.fL':'.fR');
    anim(f,[{transform:'translateY(-52px)'},{transform:'translateY(0)',offset:.42,easing:'ease-in'},{transform:'translateY(-52px)'}],{duration:250,easing:'ease-out'});
    later(function(){ impact(side); },105);
  }
  function startDrum(s){
    scene.dataset.phase='drum'; phase='drum'; setHint('toque para pular');
    if(reduce){ later(function(){ reveal(s,true); },400); return; }
    var beats=[[0,'L'],[480,'R'],[920,'L'],[1320,'R'],[1650,'L'],[1930,'R'],[2160,'L'],[2340,'R']];
    beats.forEach(function(b){ later(function(){ hit(b[1]); },b[0]); });
    later(function(){ var c=$('#cap'); if(c) c.textContent='tá vindo…'; },1500);
    later(function(){ var c=$('#cap'); if(c) c.textContent='agora!'; },2700);
    later(function(){
      ['.fL','.fR'].forEach(function(q){
        anim(scene.querySelector(q),[{transform:'translateY(-52px)'},{transform:'translateY(-125px)'}],{duration:440,easing:'ease-out',fill:'forwards'});
      });
    },2520);
    later(function(){
      ['.fL','.fR'].forEach(function(q){
        anim(scene.querySelector(q),[{transform:'translateY(-125px)'},{transform:'translateY(0)'}],{duration:110,easing:'ease-in',fill:'forwards'});
      });
      later(function(){ reveal(s,false); },105);
    },3020);
  }
  function reveal(s,skipped){
    if(phase==='rev') return;
    phase='rev'; scene.dataset.phase='rev';
    var big=$('#big'); big.classList.add('pop');
    thump(true); chime(); flash(); countUp(big,s.n); confetti(big);
    live.textContent=fmt(s.n)+' '+s.label;
    setHint(cur===S.length-1?'':'toque para continuar');
  }

  /* ---------- navegação ---------- */
  function go(i){
    clearAll();
    cur=Math.max(0,Math.min(S.length-1,i));
    var s=S[cur];
    stage.className='th-'+s.th;
    renderBars();
    scene.innerHTML=html(s);
    var g=$('#go'); if(g) g.addEventListener('click',function(e){ e.stopPropagation(); ensureAudio(); go(1); });
    var a=$('#again'); if(a) a.addEventListener('click',function(e){ e.stopPropagation(); go(0); });
    if(s.t==='num'||s.t==='learn'){ phase='pre'; startDrum(s); }
    else{
      phase='rev'; scene.dataset.phase='rev';
      if(s.t==='final'){ setHint(''); later(function(){ thump(true); chime(); confetti($('.fin .h1')); },350); live.textContent='parabéns, '+NOME; }
      else setHint('toque para começar');
    }
  }
  function next(){
    var s=S[cur];
    if(phase==='drum'){ clearAll(); reveal(s,true); return; }
    if(cur<S.length-1) go(cur+1);
  }
  function prev(){ if(cur>0) go(cur-1); else go(0); }

  stage.addEventListener('click',function(e){
    if(e.target.closest('button')) return;
    ensureAudio();
    var r=stage.getBoundingClientRect();
    if((e.clientX-r.left)/r.width<.28) prev(); else next();
  });
  document.addEventListener('keydown',function(e){
    if(e.target.closest && e.target.closest('button')) return;
    if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'){ e.preventDefault(); ensureAudio(); next(); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); prev(); }
  });

  go(0);
})();
</script>
</body>
</html>
